<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#19191b">
    <meta name="description" content="NOC HORRORÓW — zaproszenie na piątek, 30 października 2026, Warszawa.">
    <title>NOC HORRORÓW — zaproszenie</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --ink: #f5f4f2;
        --muted: rgba(245, 244, 242, .7);
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        background: #19191b;
        isolation: isolate;
      }

      body::before {
        position: fixed;
        z-index: 0;
        inset: -36px;
        content: "";
        pointer-events: none;
        background: url("./assets/noc-background.jpg") center / cover no-repeat;
        filter: blur(36px) brightness(.56) saturate(.72);
        transform: scale(1.06);
      }

      .scene {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: start center;
        padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
        background: transparent;
      }

      .scene::before,
      .scene::after {
        position: fixed;
        z-index: 0;
        right: 0;
        left: 0;
        content: "";
        pointer-events: none;
      }

      .scene::before {
        top: 0;
        bottom: 0;
        background: url("./assets/noc-background.jpg") center / auto 88% no-repeat;
        filter: brightness(.86);
      }

      .scene::after {
        top: 43%;
        bottom: 0;
        background: linear-gradient(180deg, rgba(25, 25, 27, .18), rgba(25, 25, 27, .82) 58%, #19191b 100%);
        -webkit-backdrop-filter: blur(36px) saturate(88%);
        backdrop-filter: blur(36px) saturate(88%);
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, .45) 28%, #000 62%);
        mask-image: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, .45) 28%, #000 62%);
      }

      @media (max-width: 699px) {
        .scene::before {
          background-position: center calc(100% - 209px);
          background-size: auto 88%;
        }
        .scene::after { top: 30%; }
      }

      .invite-wrap {
        position: relative;
        z-index: 1;
        display: flex;
        width: min(100%, 460px);
        flex-direction: column;
        gap: 8px;
      }

      .invite {
        position: relative;
        width: 100%;
        background: transparent;
      }

      .invite__info {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: calc(clamp(230px, 32svh, 300px) + 54px) 15px 0;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 9.5vw, 48px);
        font-weight: 850;
        letter-spacing: -.065em;
        line-height: 1;
      }

      .date {
        margin: 10px 0 0;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -.015em;
      }

      .location {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 450;
        line-height: 1.35;
      }

      .actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
      }

      .map {
        position: relative;
        display: block;
        width: min(56vw, 240px);
        height: 150px;
        flex: 0 0 auto;
        overflow: hidden;
        border: 1px solid rgba(150, 150, 150, .24);
        border-radius: 19px;
        background: #151517;
      }

      .map iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        filter: grayscale(1) invert(.94) brightness(.68) contrast(.92);
      }

      .map__open {
        position: absolute;
        right: 8px;
        bottom: 7px;
        display: inline-flex;
        align-items: center;
        padding: 6px 9px;
        border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 999px;
        color: white;
        background: rgba(5, 6, 8, .88);
        font-size: 10px;
        font-weight: 600;
        text-decoration: none;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }

      .map__open svg {
        width: 10px;
        height: 10px;
        margin-left: 3px;
      }

      .calendar {
        display: inline-flex;
        width: min(56vw, 240px);
        flex: 0 0 auto;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 15px;
        border: 1px solid rgba(176, 174, 169, .2);
        color: var(--ink);
        background: rgba(17, 18, 20, .97);
        box-shadow: 0 5px 18px rgba(0, 0, 0, .2);
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        transition: transform .18s ease, background-color .18s ease;
      }

      .calendar:hover { background: rgba(30, 31, 34, .98); transform: translateY(-1px); }
      .calendar:active { transform: scale(.985); }
      .calendar:focus-visible, a:focus-visible { outline: 2px solid white; outline-offset: 4px; }

      @media (min-width: 700px) {
        .invite-wrap { width: min(100%, 400px); }
        .invite__info { margin-top: clamp(350px, 44svh, 420px); }
      }

      @media (max-height: 720px) and (max-width: 699px) {
        .invite-wrap { width: min(100%, 340px); }
        .scene { padding-top: 12px; padding-bottom: 12px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="invite-wrap">
        <article class="invite" aria-labelledby="event-title">
          <div class="invite__info">
            <h1 id="event-title">NOC<br>HORRORÓW</h1>
            <p class="date"><time datetime="2026-10-30T20:00:00+01:00">pt., 30 października o 20:00</time></p>
            <p class="location">Broniwoja 8/30</p>
          </div>
        </article>

        <div class="actions">
          <div class="map" aria-label="Mapa Google: Broniwoja 8/30, Warszawa">
            <iframe
              title="Google Maps — Broniwoja 8/30, Warszawa"
              src="https://maps.google.com/maps?q=Broniwoja%208%2F30%2C%20Warszawa&output=embed"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              >
            </iframe>
            <a class="map__open" href="https://www.google.com/maps/search/?api=1&amp;query=Broniwoja%208%2F30%2C%20Warszawa" target="_blank" rel="noopener noreferrer">Otwórz w Google Maps
              <svg aria-hidden="true" viewBox="0 0 12 12" fill="none">
                <path d="M4 2h6v6M10 2 3 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </div>

          <button class="calendar" id="calendar-button" type="button">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 20 20" fill="none">
              <rect x="2.2" y="4.1" width="15.6" height="13.2" rx="2.2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M6.2 2.5v3.2M13.8 2.5v3.2M2.5 8h15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Dodaj do kalendarza
          </button>
        </div>
      </div>
    </main>

    <script>
      const calendarButton = document.querySelector("#calendar-button");
      calendarButton.addEventListener("click", () => {
        const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
        const event = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//NOC//Zaproszenie//PL",
          "CALSCALE:GREGORIAN",
          "BEGIN:VEVENT",
          "UID:noc-20261030@noc",
          "DTSTAMP:" + stamp,
          "DTSTART:20261030T190000Z",
          "DURATION:PT4H",
          "SUMMARY:NOC HORRORÓW",
          "LOCATION:Broniwoja 8/30\\, Warszawa",
          "DESCRIPTION:Organizator: Arian Fabiszewski\\nTelefon: 508 229 304",
          "END:VEVENT",
          "END:VCALENDAR",
          ""
        ].join("\r\n");
        const file = new Blob([event], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(file);
        const link = document.createElement("a");
        link.href = url;
        link.download = "noc-horrorow-30-pazdziernika-2026.ics";
        link.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    </script>
  </body>
</html>
