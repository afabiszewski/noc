<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#373635">
    <meta name="description" content="Zaproszenie na NOC — 30 października 2026, Warszawa.">
    <title>NOC — zaproszenie</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --ink: #f8f7f4;
        --muted: rgba(248, 247, 244, .7);
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        background: #373635;
      }

      .scene {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
        background:
          radial-gradient(ellipse at 50% 36%, rgba(117, 113, 108, .48), transparent 52%),
          linear-gradient(145deg, #444240, #292929);
      }

      .invite {
        position: relative;
        display: flex;
        width: min(100%, 440px);
        height: min(760px, calc(100svh - 36px));
        min-height: 620px;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 38px;
        background: #272729;
        box-shadow: 0 28px 90px rgba(0, 0, 0, .38), inset 0 1px rgba(255, 255, 255, .16);
        isolation: isolate;
      }

      .invite__photo {
        position: relative;
        z-index: 0;
        flex: 0 0 52%;
        min-height: 270px;
        background-color: #252527;
        background-image:
          linear-gradient(180deg, rgba(5, 6, 8, .05) 45%, rgba(9, 10, 12, .16) 100%),
          url("./assets/noc-background.jpg");
        background-position: center, center 36%;
        background-size: cover;
      }

      .organizer-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 20px;
        padding: 9px 14px 9px 11px;
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 999px;
        color: white;
        background: rgba(38, 38, 40, .48);
        box-shadow: 0 4px 18px rgba(0, 0, 0, .12);
        font-size: 14px;
        font-weight: 650;
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
      }

      .organizer-badge svg { flex: 0 0 auto; }

      .invite__details {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 0;
        flex: 1 1 auto;
        flex-direction: column;
        align-items: center;
        margin-top: -48px;
        padding: 0 22px 20px;
        border-top: 1px solid rgba(255, 255, 255, .12);
        border-radius: 34px 34px 0 0;
        background: linear-gradient(180deg, rgba(54, 53, 53, .54), rgba(47, 47, 49, .9) 43%, rgba(42, 42, 44, .96));
        box-shadow: 0 -14px 32px rgba(0, 0, 0, .1);
        -webkit-backdrop-filter: blur(32px) saturate(110%);
        backdrop-filter: blur(32px) saturate(110%);
        text-align: center;
      }

      .avatar {
        display: grid;
        width: 46px;
        height: 46px;
        flex: 0 0 auto;
        place-items: center;
        margin-top: -23px;
        border: 2px solid rgba(255, 255, 255, .8);
        border-radius: 50%;
        color: #2b2b2d;
        background: linear-gradient(145deg, #f0efed, #bcbab7);
        box-shadow: 0 5px 15px rgba(0, 0, 0, .25);
        font-size: 13px;
        font-weight: 750;
        letter-spacing: -.04em;
      }

      h1 {
        margin: 7px 0 0;
        font-size: clamp(54px, 15vw, 68px);
        font-weight: 850;
        letter-spacing: -.075em;
        line-height: 1;
      }

      .host {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
      }

      .host a {
        color: inherit;
        text-decoration-color: rgba(255, 255, 255, .46);
        text-underline-offset: 3px;
      }

      .date {
        margin: 15px 0 0;
        font-size: 17px;
        font-weight: 620;
        letter-spacing: -.02em;
      }

      .location {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin: 9px 0 11px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 500;
      }

      .location svg { flex: 0 0 auto; color: var(--ink); }

      .map {
        position: relative;
        display: block;
        width: 100%;
        height: 84px;
        min-height: 84px;
        flex: 0 0 84px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .17);
        border-radius: 17px;
        background: #292a2d;
        text-decoration: none;
      }

      .map__art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .map__open {
        position: absolute;
        right: 9px;
        bottom: 8px;
        display: inline-flex;
        align-items: center;
        padding: 7px 10px;
        border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 999px;
        color: white;
        background: rgba(10, 11, 14, .76);
        font-size: 11px;
        font-weight: 600;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }

      .map__open svg {
        width: 11px;
        height: 11px;
        margin-left: 3px;
      }

      .calendar {
        display: inline-flex;
        width: 100%;
        min-height: 48px;
        flex: 0 0 auto;
        align-items: center;
        justify-content: center;
        gap: 9px;
        margin-top: 11px;
        border: 0;
        border-radius: 15px;
        color: #17181b;
        background: #f6f4ef;
        box-shadow: 0 5px 18px rgba(0, 0, 0, .2);
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform .18s ease, background-color .18s ease;
      }

      .calendar:hover { background: #fff; transform: translateY(-1px); }
      .calendar:active { transform: scale(.985); }
      .calendar:focus-visible, a:focus-visible { outline: 2px solid white; outline-offset: 4px; }

      @media (min-width: 700px) {
        .scene { padding: 36px; }
        .invite { width: min(100%, 450px); height: min(780px, calc(100svh - 72px)); }
        .invite__photo { flex-basis: 53%; }
        .invite__details { padding-right: 27px; padding-left: 27px; }
      }

      @media (max-height: 720px) {
        .invite { min-height: 590px; }
        .invite__photo { flex-basis: 47%; min-height: 230px; }
        .invite__details { padding-bottom: 14px; }
        .date { margin-top: 10px; }
        .location { margin-top: 6px; margin-bottom: 8px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <article class="invite" aria-labelledby="event-title">
        <div class="invite__photo">
          <div class="organizer-badge">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none">
              <path d="m3 6 4.1 3.2L10 4l2.9 5.2L17 6l-1.7 9H4.7L3 6Z" fill="currentColor"/>
              <circle cx="3" cy="5" r="1.3" fill="currentColor"/>
              <circle cx="10" cy="3" r="1.3" fill="currentColor"/>
              <circle cx="17" cy="5" r="1.3" fill="currentColor"/>
            </svg>
            Organizuję
          </div>
        </div>

        <div class="invite__details">
          <div class="avatar" aria-label="Inicjały organizatora">AF</div>
          <h1 id="event-title">NOC</h1>
          <p class="host">Arian Fabiszewski · <a href="tel:+48508229304">508 229 304</a></p>

          <p class="date"><time datetime="2026-10-30T21:00:00+01:00">pt., 30 października 2026 · 21:00</time></p>
          <p class="location">
            <svg aria-hidden="true" width="15" height="18" viewBox="0 0 16 19" fill="none">
              <path d="M13.7 7.55c0 4.18-5.7 10-5.7 10s-5.7-5.82-5.7-10a5.7 5.7 0 1 1 11.4 0Z" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="8" cy="7.5" r="1.8" stroke="currentColor" stroke-width="1.5"/>
            </svg>
            Broniwoja 8/30 · Warszawa
          </p>

          <a class="map" href="https://maps.google.com/?q=Broniwoja+8%2F30%2C+Warszawa" target="_blank" rel="noopener noreferrer" aria-label="Otwórz mapę z lokalizacją Broniwoja 8/30 w Warszawie">
            <svg class="map__art" aria-hidden="true" viewBox="0 0 360 84" preserveAspectRatio="none">
              <rect width="360" height="84" fill="#292a2d"/>
              <path d="M-22 62C56 52 86 29 151 32s111 43 234 8" fill="none" stroke="#3b3d40" stroke-width="23"/>
              <path d="M-22 62C56 52 86 29 151 32s111 43 234 8" fill="none" stroke="#55575a" stroke-width="1"/>
              <path d="M54-16c21 30 31 49 22 111M246-18c-27 36-39 71-30 117M334-18c-34 27-41 60-29 111" fill="none" stroke="#424448" stroke-width="12"/>
              <path d="M54-16c21 30 31 49 22 111M246-18c-27 36-39 71-30 117M334-18c-34 27-41 60-29 111" fill="none" stroke="#5b5d60" stroke-width="1"/>
              <path d="m12 9 26-8 10 13-22 8Zm83 4 28-9 15 13-27 10Zm155 2 24-9 16 12-24 10Zm47 42 27-9 15 13-27 9Z" fill="#333539" stroke="#45474a" stroke-width="1"/>
              <path d="M180 24c-8.3 0-15 6.7-15 15 0 11 15 27 15 27s15-16 15-27c0-8.3-6.7-15-15-15Z" fill="#ed655d" stroke="#fff" stroke-width="1.5"/>
              <circle cx="180" cy="39" r="5" fill="#fff"/>
            </svg>
            <span class="map__open">Otwórz mapę
              <svg aria-hidden="true" viewBox="0 0 12 12" fill="none">
                <path d="M4 2h6v6M10 2 3 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </a>

          <button class="calendar" id="calendar-button" type="button">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 20 20" fill="none">
              <rect x="2.2" y="4.1" width="15.6" height="13.2" rx="2.2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M6.2 2.5v3.2M13.8 2.5v3.2M2.5 8h15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Dodaj do kalendarza
          </button>
        </div>
      </article>
    </main>

    <script>
      const calendarButton = document.querySelector("#calendar-button");
      calendarButton.addEventListener("click", () => {
        const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
        const event = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//NOC//Zaproszenie//PL",
          "CALSCALE:GREGORIAN",
          "BEGIN:VEVENT",
          "UID:noc-20261030@noc",
          "DTSTAMP:" + stamp,
          "DTSTART:20261030T200000Z",
          "DURATION:PT4H",
          "SUMMARY:NOC",
          "LOCATION:Broniwoja 8/30\\, Warszawa",
          "DESCRIPTION:Organizator: Arian Fabiszewski\\nTelefon: 508 229 304",
          "END:VEVENT",
          "END:VCALENDAR",
          ""
        ].join("\r\n");
        const file = new Blob([event], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(file);
        const link = document.createElement("a");
        link.href = url;
        link.download = "noc-30-pazdziernika-2026.ics";
        link.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    </script>
  </body>
</html>
