<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#393837">
    <meta name="description" content="NOC — zaproszenie na piątek, 30 października 2026, Warszawa.">
    <title>NOC — zaproszenie</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --ink: #faf9f6;
        --muted: rgba(250, 249, 246, .76);
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        color: var(--ink);
        background: #393837;
      }

      .scene {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
        background:
          radial-gradient(ellipse at 50% 40%, rgba(111, 107, 102, .42), transparent 58%),
          linear-gradient(145deg, #464442, #302f2e);
      }

      .invite-wrap {
        display: flex;
        width: min(100%, 460px);
        flex-direction: column;
        gap: 12px;
      }

      .invite {
        position: relative;
        width: 100%;
        aspect-ratio: .58;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 38px;
        background-color: #343333;
        background-image:
          linear-gradient(180deg, rgba(10, 10, 12, .04) 35%, rgba(10, 10, 12, .08) 58%, rgba(40, 39, 38, .18)),
          url("./assets/noc-background.jpg");
        background-position: center, center bottom;
        background-size: 100% 100%, auto 110%;
        box-shadow: 0 26px 70px rgba(0, 0, 0, .24), inset 0 1px rgba(255, 255, 255, .18);
        isolation: isolate;
      }

      .invite::after {
        position: absolute;
        z-index: 1;
        right: 0;
        bottom: 0;
        left: 0;
        height: 41%;
        content: "";
        border-radius: 32px 32px 0 0;
        background: linear-gradient(180deg, rgba(65, 64, 63, .25), rgba(72, 71, 69, .76) 54%, rgba(78, 77, 75, .88));
        -webkit-backdrop-filter: blur(30px) saturate(112%);
        backdrop-filter: blur(30px) saturate(112%);
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, .62) 20%, #000 46%);
        mask-image: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, .62) 20%, #000 46%);
        pointer-events: none;
      }

      .organizer-badge {
        position: absolute;
        z-index: 2;
        top: 18px;
        left: 19px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 13px 8px 10px;
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 999px;
        color: white;
        background: rgba(87, 86, 83, .58);
        box-shadow: 0 4px 18px rgba(0, 0, 0, .12);
        font-size: 14px;
        font-weight: 650;
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
      }

      .organizer-badge svg { flex: 0 0 auto; }

      .invite__info {
        position: absolute;
        z-index: 2;
        right: 15px;
        bottom: 19px;
        left: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .avatar {
        display: grid;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        place-items: center;
        margin-bottom: 7px;
        border: 2px solid rgba(255, 255, 255, .92);
        border-radius: 50%;
        color: #333231;
        background: linear-gradient(145deg, #f3f2ef, #c5c3c0);
        box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
        font-size: 11px;
        font-weight: 750;
        letter-spacing: -.04em;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 9.5vw, 48px);
        font-weight: 850;
        letter-spacing: -.065em;
        line-height: 1;
      }

      .host {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
      }

      .host a {
        color: inherit;
        text-decoration: none;
      }

      .date {
        margin: 10px 0 0;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: -.015em;
      }

      .location {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 14px;
        font-weight: 450;
        line-height: 1.35;
      }

      .actions {
        display: grid;
        gap: 9px;
      }

      .map {
        position: relative;
        display: block;
        height: 66px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 19px;
        background: #292a2d;
        text-decoration: none;
      }

      .map__art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .map__open {
        position: absolute;
        right: 8px;
        bottom: 7px;
        display: inline-flex;
        align-items: center;
        padding: 6px 9px;
        border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 999px;
        color: white;
        background: rgba(10, 11, 14, .76);
        font-size: 10px;
        font-weight: 600;
        -webkit-backdrop-filter: blur(12px);
        backdrop-filter: blur(12px);
      }

      .map__open svg {
        width: 10px;
        height: 10px;
        margin-left: 3px;
      }

      .calendar {
        display: inline-flex;
        width: 100%;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 0;
        border-radius: 15px;
        color: #17181b;
        background: #f6f4ef;
        box-shadow: 0 5px 18px rgba(0, 0, 0, .16);
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: transform .18s ease, background-color .18s ease;
      }

      .calendar:hover { background: #fff; transform: translateY(-1px); }
      .calendar:active { transform: scale(.985); }
      .calendar:focus-visible, a:focus-visible { outline: 2px solid white; outline-offset: 4px; }

      @media (min-width: 700px) {
        .invite-wrap { width: min(100%, 400px); }
        .invite { border-radius: 40px; }
        .organizer-badge { top: 22px; left: 22px; font-size: 15px; }
        .invite__info { bottom: 23px; }
      }

      @media (max-height: 720px) and (max-width: 699px) {
        .invite-wrap { width: min(100%, 340px); }
        .scene { padding-top: 12px; padding-bottom: 12px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="invite-wrap">
        <article class="invite" aria-labelledby="event-title">
          <div class="organizer-badge">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="none">
              <path d="m3 6 4.1 3.2L10 4l2.9 5.2L17 6l-1.7 9H4.7L3 6Z" fill="currentColor"/>
              <circle cx="3" cy="5" r="1.3" fill="currentColor"/>
              <circle cx="10" cy="3" r="1.3" fill="currentColor"/>
              <circle cx="17" cy="5" r="1.3" fill="currentColor"/>
            </svg>
            Organizuję
          </div>

          <div class="invite__info">
            <div class="avatar" aria-label="Arian Fabiszewski">AF</div>
            <h1 id="event-title">NOC</h1>
            <p class="host">Arian Fabiszewski · <a href="tel:+48508229304">508 229 304</a></p>
            <p class="date"><time datetime="2026-10-30T21:00:00+01:00">pt., 30 października o 21:00</time></p>
            <p class="location">Broniwoja 8/30<br>Warszawa, Mazowieckie</p>
          </div>
        </article>

        <div class="actions">
          <a class="map" href="https://maps.google.com/?q=Broniwoja+8%2F30%2C+Warszawa" target="_blank" rel="noopener noreferrer" aria-label="Otwórz dokładną mapę: Broniwoja 8/30, Warszawa">
            <svg class="map__art" aria-hidden="true" viewBox="0 0 360 84" preserveAspectRatio="none">
              <rect width="360" height="84" fill="#292a2d"/>
              <path d="M-22 62C56 52 86 29 151 32s111 43 234 8" fill="none" stroke="#3b3d40" stroke-width="23"/>
              <path d="M-22 62C56 52 86 29 151 32s111 43 234 8" fill="none" stroke="#55575a" stroke-width="1"/>
              <path d="M54-16c21 30 31 49 22 111M246-18c-27 36-39 71-30 117M334-18c-34 27-41 60-29 111" fill="none" stroke="#424448" stroke-width="12"/>
              <path d="M54-16c21 30 31 49 22 111M246-18c-27 36-39 71-30 117M334-18c-34 27-41 60-29 111" fill="none" stroke="#5b5d60" stroke-width="1"/>
              <path d="m12 9 26-8 10 13-22 8Zm83 4 28-9 15 13-27 10Zm155 2 24-9 16 12-24 10Zm47 42 27-9 15 13-27 9Z" fill="#333539" stroke="#45474a" stroke-width="1"/>
              <path d="M180 24c-8.3 0-15 6.7-15 15 0 11 15 27 15 27s15-16 15-27c0-8.3-6.7-15-15-15Z" fill="#ed655d" stroke="#fff" stroke-width="1.5"/>
              <circle cx="180" cy="39" r="5" fill="#fff"/>
            </svg>
            <span class="map__open">Otwórz mapę
              <svg aria-hidden="true" viewBox="0 0 12 12" fill="none">
                <path d="M4 2h6v6M10 2 3 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
          </a>

          <button class="calendar" id="calendar-button" type="button">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 20 20" fill="none">
              <rect x="2.2" y="4.1" width="15.6" height="13.2" rx="2.2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M6.2 2.5v3.2M13.8 2.5v3.2M2.5 8h15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Dodaj do kalendarza
          </button>
        </div>
      </div>
    </main>

    <script>
      const calendarButton = document.querySelector("#calendar-button");
      calendarButton.addEventListener("click", () => {
        const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
        const event = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//NOC//Zaproszenie//PL",
          "CALSCALE:GREGORIAN",
          "BEGIN:VEVENT",
          "UID:noc-20261030@noc",
          "DTSTAMP:" + stamp,
          "DTSTART:20261030T200000Z",
          "DURATION:PT4H",
          "SUMMARY:NOC",
          "LOCATION:Broniwoja 8/30\\, Warszawa",
          "DESCRIPTION:Organizator: Arian Fabiszewski\\nTelefon: 508 229 304",
          "END:VEVENT",
          "END:VCALENDAR",
          ""
        ].join("\r\n");
        const file = new Blob([event], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(file);
        const link = document.createElement("a");
        link.href = url;
        link.download = "noc-30-pazdziernika-2026.ics";
        link.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    </script>
  </body>
</html>
